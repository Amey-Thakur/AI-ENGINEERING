# Name: checks.yml
# Purpose: Enforce the five guarantees the course is built on.
# Description: Runs every lesson on Linux, macOS and Windows, checks that the
#   output shown in each lesson is the output its code produces, checks that
#   nothing outside the Python standard library is imported, and checks that a
#   lesson prints the same thing on every run. Runs on every
#   change and again nightly, so that material which stops working is found by
#   this file rather than by a reader.
# License: MIT
# Author: Amey Thakur (https://github.com/Amey-Thakur)
# Date: 2026-09-26

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so that a course nobody has touched for a month is still known
    # to work.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lessons:
    name: Lessons on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python

    steps:
      - uses: actions/checkout@v4

      # No action sets up Python here on purpose. The runner's own Python is
      # used, which is also a test: the course has to work on whatever version
      # a machine happens to have, rather than on one that was pinned for it.
      - name: Python version
        run: ${{ matrix.python }} --version

      - name: Every lesson runs
        run: ${{ matrix.python }} tools/run_lessons.py

  oldest:
    name: Oldest Python the course claims
    runs-on: ubuntu-latest

    # The only job that installs a Python rather than using the runner's own.
    # The front page says the course needs 3.10 or higher, and a promise about
    # a version nobody ever runs is not a promise. Syntax that arrived later,
    # such as a multi line expression inside an f-string, fails here rather
    # than on the machine of somebody who has not upgraded.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Every lesson runs on 3.10
        run: python tools/run_lessons.py

  material:
    name: Material
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Shown output matches real output
        run: python3 tools/check_output.py

      - name: Nothing outside the standard library
        run: python3 tools/check_imports.py

      - name: The same output on every run
        run: python3 tools/check_determinism.py

      - name: The glossary still points at the course
        run: python3 tools/check_glossary.py
